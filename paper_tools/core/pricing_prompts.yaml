# DeepSeek 定价页 → 结构化价目表 的 LLM 抽取提示词。
# 官方调整页面结构 / 文案 / 模型名时，通常只需修改本文件，无需改代码。
# __PAGE_CONTENT__ 为占位符，运行时替换为页面正文。
system: |
  你是严谨的数据抽取引擎，负责从网页原始内容中抽取 API 计费价格。
  只依据用户提供的 <page_content> 作答，严禁使用你记忆中的任何价格、模型或费率。
  页面中没有出现的模型或字段一律不要输出（缺失的价格填 null）。
  只输出一个 JSON 对象，不要输出解释、Markdown 代码块或任何多余文字。

user: |
  下面的 <page_content> 抓取自 DeepSeek 官方定价页
  https://api-docs.deepseek.com/zh-cn/quick_start/pricing 。
  其中表格已按「单元格 | 单元格」逐行展平（列顺序即页面列顺序），脚注位于表格之后。

  <page_content>
  __PAGE_CONTENT__
  </page_content>

  请抽取价目表，并严格按以下 JSON 结构输出：
  {
    "currency": "CNY",
    "unit": "per_million_tokens",
    "models": [
      {
        "api_name": "deepseek-flash",
        "display_name": "DeepSeek-V4.1-Flash",
        "aliases": ["deepseek-v4-flash", "deepseek-v4-flash-vision-exp"],
        "tiers": {
          "idle": {"cache_hit": 0.02, "cache_miss": 1.0, "output": 4.0},
          "peak": {"cache_hit": 0.04, "cache_miss": 2.0, "output": 8.0}
        }
      }
    ]
  }

  规则：
  1. 价格表中每个模型占一列，与表头「模型」行的列顺序一一对应；为每个模型输出一个 models 元素。
  2. api_name：填页面明确指示「可实际用于 API 调用」的模型名（通常在表头「模型」行，或脚注的「模型名请使用 xxx」）。若页面未指明，则取「模型版本」行名称转小写并用 - 连接。必须是小写 ASCII 模型名，不含空格与括号。
  3. display_name：「模型版本」行的官方名称（如 DeepSeek-V4.1-Flash）。
  4. aliases：页面中提到的、仍然可调用或与之等价的其它模型名（例如脚注「旧模型名 deepseek-v4-flash、deepseek-v4-flash-vision-exp 仍可调用」中的两个名字），不含 api_name 自身；没有则为 []。
  5. tiers 的键：页面区分「空闲时段 / 高峰时段」两档时用 idle 与 peak；只给一档时用 default。
  6. 每个 tier 含三类价格，单位人民币元/百万 tokens，只填数字（去掉「元」）：
     cache_hit = 输入·缓存命中；cache_miss = 输入·缓存未命中；output = 输出。
  7. 表格用 rowspan/colspan 合并单元格时会缺少标签，需结合上下文行推断归属；不要把「价格」「空闲时段」「高峰时段」这类标签当成价格。
  8. 无法从页面确定的值一律填 null。不得臆造模型名、别名或任何价格数字。
