[project]
name = "paper-tools"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=2.0",
    "beautifulsoup4>=4.15.0",
    "openai>=3.37.0",
    "tqdm>=4.70.1",
    "requests>=2.34.2",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "python-docx>=1.2.0",
    "fpdf2>=2.8.9",
    "lxml>=6.1.3",
    "matplotlib>=3.11.2",
    "pillow>=13.0.0",
    "svglib>=2.3.2",
    "rlpycairo>=0.4.0",
    "markdown-it-py>=4.2.0",
    "mdit-py-plugins>=0.6.1",
]

[dependency-groups]
dev = [
    "pyrefly>=0.60.0",
]

[tool.setuptools.packages.find]
include = ["paper_tools*"]
exclude = ["temp*"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
default = true
